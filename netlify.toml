[build]
  # This file sits at the git repo root, so no base directory is needed.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires ^20.19.0 || >=22.12.0 — Netlify's older default (18) fails the build.
  NODE_VERSION = "22"

# --- Content Security Policy -------------------------------------------------
#
# frame-src is what lets the Custom Dash iframe load at all. A host missing from
# it is blocked with no visible error — the frame just stays empty — so this is
# the first thing to check when a dashboard renders blank.
#
# connect-src covers *.alphacapitalgroup.uk rather than the two exact hosts in
# .env.example on purpose: VITE_BASE_URL and VITE_RISK_API_BASE are build-time
# config that differs per environment, and a header pinned to one pair would
# silently kill every API call the day a deploy points at staging.
#
# Both Workers are listed exactly, never as *.workers.dev — that wildcard would
# allow every Cloudflare Worker on the internet. They are two distinct hosts:
#   -api  is called directly by the browser (VITE_RISK_CUSTOM_DASH_BASE), so it
#         belongs in connect-src; a missing entry blocks the catalogue.
#   -view serves the dashboard bundles into the iframe, so it belongs in
#         frame-src; a missing entry leaves the frame silently blank.
#
# style-src keeps 'unsafe-inline' because the app styles almost entirely through
# inline style props; script-src does not need it (Vite emits external modules).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.alphacapitalgroup.uk https://alpharisk-dash-api.swarnab.workers.dev; frame-src https://alpharisk-dash-view.swarnab.workers.dev; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# SPA fallback: the app has no server-side routes, so every path must serve
# index.html and let React render. Without this, a refresh on any URL other
# than "/" returns Netlify's 404 page — including a Custom Dash deep link,
# which carries its state in the query string on "/".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
